name: FPL public API diagnostic
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6 * * 1'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test public FPL endpoints
        run: python scripts/diagnose_fpl_api.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fpl-api-diagnostic
          path: fpl-api-diagnostic.json
          retention-days: 14
